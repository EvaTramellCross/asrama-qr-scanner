<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Asrama QR Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
    }

    p {
      color: #666;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #0081cc;
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
    }

    button:disabled {
      background: #999;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: white;
      font-weight: bold;
      line-height: 1.5;
    }

    .success {
      background: #d1e7dd !important;
      color: #0f5132;
    }

    .error {
      background: #f8d7da !important;
      color: #842029;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>📷 Student QR Scanner</h1>

  <p>
    Tap the button below to activate the camera.
  </p>


  <button
    id="cameraButton"
    onclick="startScanner()">

    📷 ENABLE CAMERA

  </button>


  <div id="reader"></div>


  <div id="result">

    Waiting for camera...

  </div>

</div>


<script>


let scanner = null;

let scanned = false;


// ======================================
// START CAMERA
// ======================================

async function startScanner() {

  const button =
    document.getElementById(
      'cameraButton'
    );

  const result =
    document.getElementById(
      'result'
    );


  if (scanned) {
    return;
  }


  button.disabled = true;

  result.className = '';

  result.innerText =
    '🔄 Requesting camera permission...';


  try {

    // ==================================
    // STEP 1
    // Ask the browser for camera access
    // ==================================

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'environment'
          }
        },

        audio: false

      });


    // ==================================
    // STEP 2
    // Stop the temporary camera stream
    // ==================================

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });


    result.innerText =
      '✅ Camera permission granted.\n\nStarting QR scanner...';


    // ==================================
    // STEP 3
    // Get available cameras
    // ==================================

    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        'No camera was detected on this device.'
      );

    }


    // ==================================
    // STEP 4
    // Choose camera
    // ==================================

    let cameraId =
      cameras[0].id;


    // Prefer the back/rear camera

    const backCamera =
      cameras.find(function(camera) {

        const label =
          camera.label.toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment')
        );

      });


    if (backCamera) {

      cameraId =
        backCamera.id;

    }


    // ==================================
    // STEP 5
    // Start QR scanner
    // ==================================

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      function(decodedText) {

        if (scanned) {
          return;
        }


        scanned = true;


        handleQRCode(
          decodedText
        );

      },

      function(errorMessage) {

        // Normal QR scanning errors
        // are ignored.

      }

    );


    result.className = '';

    result.innerText =
      '📷 CAMERA ACTIVE\n\nPoint the camera at the student QR code.';


  }

  catch (error) {

    console.error(
      'Camera error:',
      error
    );


    button.disabled = false;


    result.className =
      'error';


    let message =
      '❌ Unable to access camera.';


    if (
      error &&
      error.name ===
      'NotAllowedError'
    ) {

      message =
        '❌ Camera permission was denied.\n\n' +
        'Please allow camera access for this website, ' +
        'then try again.';

    }

    else if (
      error &&
      error.name ===
      'NotFoundError'
    ) {

      message =
        '❌ No camera was found on this device.';

    }

    else if (
      error &&
      error.name ===
      'NotReadableError'
    ) {

      message =
        '❌ The camera is currently being used by another app.\n\n' +
        'Close other camera apps and try again.';

    }

    else if (
      error &&
      error.name ===
      'SecurityError'
    ) {

      message =
        '❌ The browser blocked camera access for security reasons.';

    }

    else if (error && error.message) {

      message =
        '❌ Camera error:\n\n' +
        error.message;

    }


    result.innerText =
      message;

  }

}


// ======================================
// QR CODE FOUND
// ======================================

async function handleQRCode(
  studentID
) {

  const result =
    document.getElementById(
      'result'
    );


  result.className =
    'success';


  result.innerHTML =
    '✅ QR CODE FOUND<br><br>' +
    'Student ID: ' +
    studentID +
    '<br><br>' +
    'Returning to app...';


  if (scanner) {

    try {

      await scanner.stop();

      scanner.clear();

    }

    catch (error) {

      console.log(
        'Scanner stop error:',
        error
      );

    }

  }


  returnToApp(
    studentID
  );

}


// ======================================
// RETURN TO APPS SCRIPT
// ======================================

function returnToApp(
  studentID
) {

  const appsScriptURL =
    'https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbzzNT2QL_vTKBuF_UYqPFlffHcOdk5d18HS1ua-cEsbtPJVWzVORdM9SNSe8OJ7uFsm/exec';


  const returnURL =
    appsScriptURL +
    '?studentID=' +
    encodeURIComponent(
      studentID
    );


  setTimeout(function() {

    window.location.href =
      returnURL;

  }, 800);

}


</script>


</body>

</html>
