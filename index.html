<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Asrama QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #0081cc;
      color: white;
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: white;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 Student QR Scanner</h1>

  <p>
    Tap the button below to activate the camera.
  </p>

  <button onclick="startScanner()">
    📷 ENABLE CAMERA
  </button>

  <div id="reader"></div>

  <div id="result">
    Waiting for camera...
  </div>

</div>


<script>

let scanner = null;
let scanned = false;


// ===============================
// START CAMERA
// ===============================

function startScanner() {

  document.getElementById('result').innerText =
    'Starting camera...';


  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      if (scanned) return;

      scanned = true;

      handleQRCode(decodedText);

    },

    function(errorMessage) {

      // Ignore normal scanning errors

    }

  ).then(function() {

    document.getElementById('result').innerText =
      '📷 Camera active — scan the student QR code.';

  }).catch(function(error) {

    console.log(error);

    document.getElementById('result').innerHTML =
      '❌ Unable to access camera.<br><br>' +
      'Please check your browser camera permission.';

  });

}


// ===============================
// QR CODE FOUND
// ===============================

function handleQRCode(studentID) {

  document.getElementById('result').innerHTML =
    '✅ QR CODE FOUND<br><br>' +
    'Student ID: ' +
    studentID +
    '<br><br>' +
    'Returning to app...';


  if (scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

        returnToApp(studentID);

      })
      .catch(function() {

        returnToApp(studentID);

      });

  } else {

    returnToApp(studentID);

  }

}


// ===============================
// RETURN TO APPS SCRIPT
// ===============================

function returnToApp(studentID) {

  const appsScriptURL =
    'https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbzzNT2QL_vTKBuF_UYqPFlffHcOdk5d18HS1ua-cEsbtPJVWzVORdM9SNSe8OJ7uFsm/exec';


  const returnURL =
    appsScriptURL +
    '?studentID=' +
    encodeURIComponent(studentID);


  setTimeout(function() {

    window.location.href =
      returnURL;

  }, 800);

}

</script>

</body>

</html>
