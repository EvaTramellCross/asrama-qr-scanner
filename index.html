<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Asrama QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: white;
      font-weight: bold;
    }

    .success {
      color: #198754;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 Student QR Scanner</h1>

  <p>
    Scan the student's QR code.
  </p>

  <div id="reader"></div>

  <div id="result">
    Waiting for QR code...
  </div>

</div>


<script>

let scanner = null;


// ===============================
// START CAMERA
// ===============================

function startScanner() {

  scanner =
    new Html5Qrcode("reader");

  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    function(decodedText) {

      handleQRCode(decodedText);

    },

    function(errorMessage) {

      // Ignore scanning errors

    }

  ).catch(function(error) {

    document
      .getElementById("result")
      .innerText =
      "❌ Unable to access camera.";

  });

}


// ===============================
// QR CODE FOUND
// ===============================

function handleQRCode(studentID) {

  document
    .getElementById("result")
    .innerHTML =
    "<span class='success'>" +
    "✅ QR CODE FOUND<br><br>" +
    "Student ID: " +
    studentID +
    "<br><br>" +
    "Returning to app..." +
    "</span>";


  stopScanner();


  // Send Student ID back
  // to the Apps Script app

  const appsScriptURL =
    "https://script.google.com/a/macros/moe-dl.edu.my/s/AKfycbzzNT2QL_vTKBuF_UYqPFlffHcOdk5d18HS1ua-cEsbtPJVWzVORdM9SNSe8OJ7uFsm/exec";


  const returnURL =
    appsScriptURL +
    "?studentID=" +
    encodeURIComponent(studentID);


  setTimeout(function() {

    window.location.href =
      returnURL;

  }, 1000);

}


// ===============================
// STOP CAMERA
// ===============================

function stopScanner() {

  if (scanner) {

    scanner.stop()
      .then(function() {

        scanner.clear();

      })
      .catch(function(error) {

        console.log(error);

      });

  }

}


// Automatically start camera

window.onload = function() {

  startScanner();

};

</script>

</body>

</html>
